name: CanvasEditor
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  DesignCanvas:
    path: ..
targets:
  CanvasEditor:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources: [Sources]
    dependencies:
      - package: DesignCanvas
        product: CanvasCore
      - package: DesignCanvas
        product: CanvasRender
      - package: DesignCanvas
        product: CanvasMCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pitcrew.canvas-editor
        PRODUCT_NAME: Canvas Editor
        # iPhone and iPad without the Mac idiom: on the Mac the app runs "scaled to
        # match iPad", so screens render with iOS controls, not macOS ones.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
