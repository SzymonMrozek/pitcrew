name: session-broker

on:
  push:
    branches: [main]
    paths: ["session-broker/**", ".github/workflows/session-broker.yml"]
  pull_request:
    paths: ["session-broker/**", ".github/workflows/session-broker.yml"]

defaults:
  run:
    working-directory: session-broker

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag session-broker .
      - run: docker run --rm session-broker pytest

  swift-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Start broker
        run: |
          SESSION_FILE="$RUNNER_TEMP/session.json" uvicorn app:app --port 8765 &
          for _ in $(seq 30); do curl --fail --silent http://127.0.0.1:8765/health && exit 0; sleep 1; done
          exit 1
      - run: swift test --no-parallel
        working-directory: session-broker/examples/swift
        env:
          SESSION_BROKER_URL: http://127.0.0.1:8765

  ios-example:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: session-broker/examples/ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: session-broker/examples/ios-app
      - run: tuist generate --no-open
      - name: Keychain and swap tests
        run: |
          # Runner images change their simulators, so take the first available iPhone.
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -workspace SessionStoreExample.xcworkspace -scheme SessionStoreExample \
            -destination "id=$udid"
